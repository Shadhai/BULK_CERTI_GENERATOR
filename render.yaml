services:
  - type: web
    name: bulk-certificate-generator
    env: python
    plan: free
    region: oregon
    rootDir: .
    buildCommand: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: BCG_DATABASE_URL
        value: sqlite:///./bcg.db
      - key: BCG_STORAGE_ROOT
        value: /tmp/bcg-storage
      - key: BCG_WORKER_ENABLED
        value: "true"
      - key: BCG_API_KEY
        sync: false
